name: Fritolay Frontend CI/CD

on:
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Frontend Dependencies
        run: cd frontend && npm install
      - name: Build Frontend Assets
        run: cd frontend && npm run build
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Docker to use GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and Push Frontend
        run: |
          IMAGE_PATH=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/frontend
          docker build -f infra/Dockerfile.frontend -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest ./frontend
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest
      - name: Deploy Frontend to Cloud Run
        run: |
          IMAGE_PATH=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/frontend
          gcloud run deploy frontend-service \
            --image=$IMAGE_PATH:latest \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated

