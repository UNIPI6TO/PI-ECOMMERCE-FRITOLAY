name: Semantic Versioning & Tagging

on:
  push:
    branches: [ "main" ]

jobs:
  tagging:
    name: Auto Tag Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Release Version & Push Tag
        id: semver
        run: |
          # Obtener el último tag base o valor por defecto
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          CLEAN_TAG=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
          
          # Contar número de commits en HEAD
          REVISION=$(git rev-list --count HEAD)
          
          FINAL_TAG="v${MAJOR}.${MINOR}.${REVISION}"
          
          echo "Calculated Release Tag: ${FINAL_TAG}"
          
          # Configurar credenciales del bot de Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Crear y publicar el tag definitivo de Release en el repositorio
          git tag -a "${FINAL_TAG}" -m "Release version ${FINAL_TAG}" || true
          git push origin "${FINAL_TAG}" || true
