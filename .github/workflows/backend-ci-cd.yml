name: Backend Build & Deploy

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión a construir y desplegar (Ej: v1.4.15)'
        required: true
        default: 'v1.0.0'

jobs:
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: fritolay_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, zip

      - name: Install Backend Dependencies
        run: cd backend && composer install --no-interaction --prefer-dist

      - name: Copy .env and Set Injected Version
        run: |
          cd backend
          cp .env.example .env
          echo "APP_VERSION=${{ github.event.inputs.tag_name }}" >> .env
          php artisan key:generate

      - name: Run Backend Tests
        run: cd backend && php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: fritolay_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          JWT_SECRET: test_jwt_secret_for_ci_minimum_32_chars
          APP_VERSION: ${{ github.event.inputs.tag_name }}

  build-and-deploy:
    name: Build & Deploy Backend API
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF or Credentials
        if: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP via Credentials JSON (Fallback)
        if: ${{ secrets.GCP_CREDENTIALS != '' && (secrets.WIF_PROVIDER == '' || secrets.WIF_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Build and Push Backend Docker Image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.event.inputs.tag_name }} \
            -f infra/Dockerfile.backend \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend:${{ github.event.inputs.tag_name }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend:latest \
            ./backend
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend:${{ github.event.inputs.tag_name }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend:latest

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy backend-api-service \
            --image=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend:${{ github.event.inputs.tag_name }} \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=APP_VERSION=${{ github.event.inputs.tag_name }} \
            --set-secrets=JWT_SECRET=JWT_SECRET:latest,DB_PASSWORD=DB_PASSWORD:latest
