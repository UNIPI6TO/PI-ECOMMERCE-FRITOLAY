name: Fritolay Backend CI/CD

on:
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, gd, zip
      - name: Install Backend Dependencies
        run: cd backend && composer install --no-interaction --prefer-dist
      - name: Copy .env
        run: cd backend && cp .env.example .env && php artisan key:generate
      - name: Run Backend Tests
        run: cd backend && php artisan test
        env:
          JWT_SECRET: test_jwt_secret_for_ci

  deploy-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Setup Docker to use GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and Push Backend
        run: |
          IMAGE_PATH=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend
          docker build -f infra/Dockerfile.backend -t $IMAGE_PATH:${{ github.sha }} -t $IMAGE_PATH:latest ./backend
          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest
      - name: Deploy Backend to Cloud Run
        run: |
          IMAGE_PATH=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/fritolay/backend
          gcloud run deploy backend-api-service \
            --image=$IMAGE_PATH:latest \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="sa-backend@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets="/secrets/.env=fritolay-backend-env:latest"

